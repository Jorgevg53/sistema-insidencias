<title>Prototipo Incidencias TESCHI</title>
<style>
:root {
    color-scheme: light;
    --color-primario: #007a3d;
    --color-primario-oscuro: #005a2d;
    --color-menu: #003f20;
    --color-acento: #43b02a;
    --color-acento-claro: #e9f7e4;
    --color-cielo: #1f7ae0;
    --color-rojo: #e30613;
    --color-fondo: #eef5ef;
    --color-tarjeta: #ffffff;
    --color-texto: #1f2a24;
    --color-suave: #5f6b64;
    --color-borde: #d5e2d8;
    --color-exito: #067647;
    --color-error: #b42318;
    --color-aviso: #f79009;
    --degradado: linear-gradient(120deg, #005a2d 0%, #007a3d 45%, #43b02a 100%);
    --sombra: 0 4px 14px rgba(0, 70, 35, 0.08);
    --sombra-alta: 0 12px 28px rgba(0, 70, 35, 0.16);
    --radio: 12px;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    background:
        radial-gradient(circle at 100% 0, rgba(67, 176, 42, 0.12), transparent 40%),
        radial-gradient(circle at 0 100%, rgba(31, 122, 224, 0.08), transparent 45%),
        var(--color-fondo);
    color: var(--color-texto);
    line-height: 1.5;
    min-height: 100vh;
}
a, .enlace { color: var(--color-primario); cursor: pointer; }
a:hover, .enlace:hover { color: var(--color-acento); }
.enlace { background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 3px solid rgba(67, 176, 42, 0.55); outline-offset: 2px; }

/* ---------- Barra de prototipo ---------- */
.proto {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    padding: 8px 24px; background: #11261a; color: #cfe8d3; font-size: 13px;
}
.proto strong { color: #fff; letter-spacing: 0.4px; }
.proto select, .proto button {
    font: inherit; font-size: 13px; padding: 3px 8px; border-radius: 6px;
    border: 1px solid #3c5c47; background: #1c3a28; color: #fff; cursor: pointer;
}
.proto .espacio { flex: 1; }
.proto select { width: auto; max-width: 100%; }

/* ---------- Encabezado y menú ---------- */
.topbar {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 24px; background: var(--degradado); color: #fff; border-bottom: 3px solid var(--color-rojo);
}
.topbar-marca { display: flex; align-items: center; gap: 12px; }
.topbar-logo { display: inline-flex; padding: 5px 9px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.18); cursor: pointer; border: 0; }
.topbar-logo img { display: block; height: 34px; width: auto; }
.topbar-marca strong { display: block; font-size: 1.05rem; letter-spacing: 0.3px; }
.topbar-marca span { opacity: 0.9; font-size: 0.85rem; }
.topbar-usuario { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 0.9rem; }
.topbar-usuario .enlace { color: #fff; }
.topbar .badge { background: rgba(255,255,255,.22); color: #fff; }
.campana { position: relative; display: inline-flex; padding: 4px; color: #fff; background: none; border: 0; cursor: pointer; }
.campana-contador {
    position: absolute; top: -4px; right: -8px; min-width: 18px; padding: 0 5px; border-radius: 999px;
    background: var(--color-aviso); color: #1f2933; font-size: 0.72rem; font-weight: 700; line-height: 18px; text-align: center;
}
.menu {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 24px; background: var(--color-menu);
    box-shadow: 0 4px 12px rgba(0, 40, 20, 0.25);
}
.menu button {
    padding: 8px 14px; border-radius: 999px; color: #d9efd9; background: none; border: 0;
    font: inherit; font-size: 0.93rem; cursor: pointer; transition: background .15s, color .15s;
}
.menu button:hover { background: rgba(255,255,255,.12); color: #fff; }
.menu button.activo { background: var(--color-acento); color: #fff; font-weight: 600; box-shadow: 0 2px 8px rgba(67,176,42,.45); }
.contenedor { max-width: 1160px; margin: 24px auto; padding-inline: 16px; }
.pie { text-align: center; color: #d9efd9; font-size: 0.85rem; padding: 18px 16px; margin-top: 32px; background: var(--color-menu); border-top: 3px solid var(--color-acento); }

/* ---------- Tarjetas ---------- */
.tarjeta {
    background: var(--color-tarjeta); border: 1px solid var(--color-borde); border-top: 4px solid var(--color-acento);
    border-radius: var(--radio); padding: 20px; margin-bottom: 20px; box-shadow: var(--sombra);
}
.tarjeta.azul { border-top-color: var(--color-cielo); }
.tarjeta.naranja { border-top-color: var(--color-aviso); }
.tarjeta h2, .tarjeta h3 { margin-top: 0; color: var(--color-primario-oscuro); }
.tarjeta h2 { font-size: 1.2rem; }
.encabezado-pagina { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.encabezado-pagina h1 { margin: 0; font-size: 1.6rem; color: var(--color-primario-oscuro); }
.encabezado-pagina h1::after { content: ""; display: block; width: 56px; height: 4px; margin-top: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--color-acento), var(--color-cielo)); }
.texto-suave { color: var(--color-suave); }
.pequeno { font-size: 0.85rem; }
.grid-resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.resumen-item {
    background: var(--color-tarjeta); border: 1px solid var(--color-borde); border-left: 5px solid var(--color-acento);
    border-radius: var(--radio); padding: 14px; box-shadow: var(--sombra); transition: transform .15s, box-shadow .15s;
}
.resumen-item.naranja { border-left-color: var(--color-aviso); }
.resumen-item.azul { border-left-color: var(--color-cielo); }
.resumen-item:hover { transform: translateY(-2px); box-shadow: var(--sombra-alta); }
.resumen-item .numero { display: block; font-size: 1.9rem; font-weight: 800; color: var(--color-primario); font-variant-numeric: tabular-nums; }
.resumen-item .etiqueta { color: var(--color-suave); font-size: 0.9rem; }
.grid-modulos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.modulo {
    display: block; text-align: left; padding: 16px; border: 1px solid var(--color-borde); border-radius: var(--radio);
    background: linear-gradient(160deg, #fff 60%, var(--color-acento-claro)); color: var(--color-texto);
    box-shadow: var(--sombra); transition: transform .15s, box-shadow .15s, border-color .15s; font: inherit; cursor: pointer;
}
.modulo:hover { border-color: var(--color-acento); transform: translateY(-3px); box-shadow: var(--sombra-alta); }
.modulo strong { display: block; color: var(--color-primario); }
.detalle-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 24px; margin: 12px 0; }
.detalle-grid dt { font-weight: 600; color: var(--color-suave); font-size: 0.82rem; }
.detalle-grid dd { margin: 0 0 4px; }
.columnas { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .columnas { grid-template-columns: 1fr; } }

/* ---------- Formularios ---------- */
.formulario { display: grid; gap: 14px; }
.formulario-2col { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.92rem; }
input[type="text"], input[type="email"], input[type="password"], input[type="tel"], input[type="search"], input[type="date"], input[type="number"], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--color-borde); border-radius: 8px; font: inherit; background: #fff; color: var(--color-texto);
    transition: border-color .15s, box-shadow .15s;
}
textarea { min-height: 92px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--color-acento); box-shadow: 0 0 0 3px rgba(67,176,42,.25); }
.requerido { color: var(--color-error); }
.filtros { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; align-items: end; }
.zona-archivos { border: 1.5px dashed var(--color-borde); border-radius: 10px; padding: 18px; text-align: center; background: #fafafa; }
.zona-archivos input { margin-top: 8px; }
.archivos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; list-style: none; padding: 0; }
.archivo { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--color-borde); border-radius: 8px; background: #fff; font-size: .85rem; }
.miniatura { width: 46px; height: 46px; border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: .75rem; background: #cfe3d3; color: var(--color-primario); }
.miniatura.pdf { background: #fef3f2; color: var(--color-error); }

/* ---------- Botones ---------- */
.btn {
    display: inline-block; padding: 9px 18px; border: 1px solid transparent; border-radius: 999px; font: inherit; font-weight: 600;
    cursor: pointer; text-decoration: none; text-align: center; transition: transform .12s, box-shadow .15s, background .15s;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--degradado); color: #fff; box-shadow: 0 4px 12px rgba(0,122,61,.3); }
.btn-primary:hover { color: #fff; box-shadow: 0 6px 18px rgba(0,122,61,.42); }
.btn-secundario { background: #fff; border-color: var(--color-borde); color: var(--color-primario-oscuro); }
.btn-secundario:hover { border-color: var(--color-acento); color: var(--color-primario); }
.btn-peligro { background: #fff; border-color: var(--color-error); color: var(--color-error); }
.btn-peligro:hover { background: var(--color-error); color: #fff; }
.btn-sm { padding: 5px 12px; font-size: 0.85rem; }
.btn-bloque { width: 100%; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- Tablas ---------- */
.tabla-contenedor { overflow-x: auto; border-radius: 10px; }
table.tabla { width: 100%; border-collapse: collapse; background: #fff; font-size: 0.93rem; }
.tabla th, .tabla td { padding: 10px; border-bottom: 1px solid var(--color-borde); text-align: left; vertical-align: middle; }
.tabla th { background: var(--color-primario); color: #fff; font-weight: 600; white-space: nowrap; }
.tabla tbody tr:nth-child(even) td { background: #f6faf6; }
.tabla tbody tr:hover td { background: var(--color-acento-claro); }
.tabla td.num { font-variant-numeric: tabular-nums; }
.folio { font-variant-numeric: tabular-nums; white-space: nowrap; }
.vacio { text-align: center; padding: 26px; color: var(--color-suave); }

/* ---------- Alertas ---------- */
.alerta { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; border: 1px solid; }
.alerta-exito { background: #ecfdf3; border-color: #abefc6; color: var(--color-exito); }
.alerta-error { background: #fef3f2; border-color: #fecdca; color: var(--color-error); }
.alerta-aviso { background: #fffaeb; border-color: #fedf89; color: #93370d; }

/* ---------- Etiquetas ---------- */
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; background: #eef0f3; color: #374151; white-space: nowrap; }
.b-pendiente { background: #fef6e7; color: #93600b; } .b-en-revision { background: #eef4ff; color: #3538cd; }
.b-asignada { background: #f4f3ff; color: #5925dc; } .b-en-proceso { background: #eff8ff; color: #175cd3; }
.b-resuelta { background: #ecfdf3; color: #067647; } .b-cerrada { background: #e4e7ec; color: #344054; }
.b-cancelada { background: #fef3f2; color: #b42318; }
.b-baja { background: #f2f4f7; color: #475467; } .b-media { background: #eff8ff; color: #175cd3; }
.b-alta { background: #fff4ed; color: #c4320a; } .b-critica { background: #fef3f2; color: #b42318; }
.b-activo { background: #ecfdf3; color: #067647; } .b-inactivo { background: #f2f4f7; color: #667085; }
.sin-asignar { color: #b54708; font-weight: 600; }

/* ---------- Línea de tiempo ---------- */
.timeline { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--color-borde); }
.evento { position: relative; padding: 0 0 16px 14px; }
.evento::before { content: ""; position: absolute; left: -25px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--color-suave); border: 2px solid #fff; }
.ev-registro::before { background: var(--color-exito); } .ev-estado::before { background: #175cd3; }
.ev-asignacion::before { background: #5925dc; } .ev-comentario::before { background: var(--color-primario); }
.ev-clasificacion::before { background: var(--color-aviso); }
.evento-texto { margin-top: 4px; padding: 10px 12px; background: #f9fafb; border: 1px solid var(--color-borde); border-radius: 8px; white-space: pre-wrap; }

/* ---------- Notificaciones ---------- */
.pestanas { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--color-borde); }
.pestanas button { padding: 8px 14px; background: none; border: 0; border-bottom: 2px solid transparent; font: inherit; color: var(--color-suave); cursor: pointer; }
.pestanas button.activo { color: var(--color-primario); border-bottom-color: var(--color-primario); font-weight: 600; }
.notificaciones { list-style: none; margin: 0; padding: 0; }
.notificacion { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--color-borde); }
.notificacion.no-leida { background: var(--color-acento-claro); border-left: 3px solid var(--color-primario); }

/* ---------- Paginación ---------- */
.paginacion { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; font-size: 0.9rem; }
.paginas { display: flex; flex-wrap: wrap; gap: 4px; }
.paginas button { min-width: 34px; padding: 5px 10px; border: 1px solid var(--color-borde); border-radius: 6px; background: #fff; font: inherit; cursor: pointer; color: var(--color-texto); }
.paginas button:hover:not(:disabled) { border-color: var(--color-primario); }
.paginas button.actual { background: var(--degradado); border-color: var(--color-primario); color: #fff; font-weight: 600; }
.paginas button:disabled:not(.actual) { color: #b0b6bf; cursor: default; }
.por-pagina { display: flex; align-items: center; gap: 6px; }
.por-pagina label { margin: 0; font-weight: normal; }
.por-pagina select { width: auto; padding: 4px 8px; }

/* ---------- Reportes ---------- */
.grid-reportes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 0 20px; }
.barras { display: grid; gap: 8px; }
.barra-fila { display: grid; grid-template-columns: minmax(110px, 40%) 1fr 40px; align-items: center; gap: 10px; font-size: 0.9rem; }
.barra-etiqueta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra-pista { height: 14px; background: #f2f4f7; border-radius: 999px; overflow: hidden; }
.barra-relleno { height: 100%; background: linear-gradient(90deg, var(--color-primario), var(--color-acento)); border-radius: 999px; transition: width .4s; }
.barra-valor { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.leyenda { display: flex; gap: 16px; font-size: 0.85rem; color: var(--color-suave); margin-bottom: 12px; }
.muestra { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: middle; margin-right: 4px; }
.m-reg { background: var(--color-primario); } .m-ate { background: var(--color-cielo); }
.columnas-mes { display: flex; gap: 12px; overflow-x: auto; padding-top: 20px; }
.columna-mes { flex: 0 0 56px; text-align: center; }
.columna-barras { display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 150px; border-bottom: 1px solid var(--color-borde); }
.columna { position: relative; width: 18px; min-height: 2px; border-radius: 4px 4px 0 0; }
.columna span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: .72rem; font-weight: 600; }
.columna-etiqueta { margin-top: 6px; font-size: .8rem; color: var(--color-suave); }

    width: 100%; max-width: 420px; background: #fff; border-radius: 18px; border-top: 6px solid var(--color-acento);
    padding: 28px 32px; box-shadow: 0 20px 50px rgba(0,30,15,.45); animation: aparecer .5s ease-out;
}
@keyframes aparecer { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.login-card h1 { margin: 0 0 10px; text-align: center; line-height: 0; }
.login-card h1 img { width: 100%; max-width: 260px; height: auto; }
.login-card h2 { margin: 4px 0; font-size: 1.35rem; text-align: center; color: var(--color-primario-oscuro); }
.login-subtitulo { color: var(--color-suave); margin: 0 0 14px; text-align: center; }
.login-subtitulo::after { content: ""; display: block; width: 70px; height: 3px; margin: 10px auto 0; border-radius: 999px; background: var(--color-rojo); }
.login-card form { display: grid; gap: 14px; margin-bottom: 14px; }
.login-pie { margin: 0; color: #fff; font-size: .85rem; text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.demo-cuentas { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--color-borde); }
.demo-cuentas p { margin: 0 0 8px; font-size: .82rem; color: var(--color-suave); }
.demo-cuentas .acciones { gap: 6px; }

/* ---------- Ticket ---------- */
.ticket { max-width: 720px; margin: 0 auto; background: #fff; border: 1px solid #c9d3cc; box-shadow: var(--sombra-alta); padding: 26px 30px; font-size: .9rem; }
.ticket-cabecera { display: grid; grid-template-columns: 90px 1fr 130px; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--color-primario); }
.ticket-cabecera img { width: 100%; height: auto; }
.ticket-cabecera .centro { text-align: center; line-height: 1.35; }
.ticket-cabecera .centro strong { display: block; font-size: .95rem; }
.ticket-seccion { margin-top: 14px; }
.ticket-seccion h3 { margin: 0 0 6px; padding: 4px 8px; background: var(--color-acento-claro); color: var(--color-primario-oscuro); font-size: .85rem; letter-spacing: .6px; text-transform: uppercase; }
.ticket-campo { display: grid; grid-template-columns: 170px 1fr; gap: 8px; padding: 4px 8px; border-bottom: 1px dotted #cfd8d2; }
.ticket-campo b { color: var(--color-suave); font-weight: 600; }
.ticket-firmas { display: grid; grid-template-columns: 1fr 1fr 120px; gap: 18px; margin-top: 34px; text-align: center; font-size: .8rem; }
.ticket-firmas div { border-top: 1px solid #333; padding-top: 4px; }
.ticket-firmas .sello { border: 1px dashed #999; height: 90px; display: grid; place-items: center; color: #999; padding: 0; }
.ticket-leyenda { text-align: center; font-weight: 700; margin-top: 14px; }
@media (max-width: 600px) {
    .ticket { padding: 18px 14px; }
    .ticket-cabecera { grid-template-columns: 60px 1fr 80px; }
    .ticket-campo { grid-template-columns: 1fr; gap: 0; }
    .ticket-firmas { grid-template-columns: 1fr; }
    .topbar, .menu, .proto { padding-inline: 16px; }
    .topbar-marca span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

function datosIniciales() {
    const categorias = ["Académica", "Administrativa", "Infraestructura", "Equipo de cómputo", "Software", "Redes", "Control Escolar", "Otra"]
        .map((n, i) => ({ id: i + 1, nombre: n, activo: true }));

    const usuarios = [
        [1, "Administrador TESCHI", "admin@teschi.edu.mx", "Administrador", "No aplica", "55 5000 0001", "ADM-0001"],
        [2, "María Hernández López", "mhernandez@teschi.edu.mx", "Coordinador", "No aplica", "55 5000 0102", "COO-0102"],
        [3, "Juan Pérez Rojas", "jperez@teschi.edu.mx", "Docente", "Ingeniería en Sistemas Computacionales", "55 1234 5678", "DOC-0457"],
        [4, "Roberto Sánchez Díaz", "rsanchez@teschi.edu.mx", "Docente", "Ingeniería Mecatrónica", "55 2345 6789", "DOC-0311"],
        [5, "Laura Ramírez Soto", "lramirez@teschi.edu.mx", "Administrativo", "No aplica", "55 3456 7890", "ADV-0220"],
        [6, "Ana López García", "alopez@teschi.edu.mx", "Estudiante", "Ingeniería Industrial", "55 4567 8901", "202312045"],
        [7, "Pedro Gómez Cruz", "pgomez@teschi.edu.mx", "Docente", "Ingeniería Química", "55 5678 9012", "DOC-0198"],
        [8, "Luis Martínez Vega", "lmartinez@teschi.edu.mx", "Estudiante", "Licenciatura en Gastronomía", "55 6789 0123", "202221987"],
    ].map(([id, nombre, correo, rol, carrera, telefono, num]) => ({ id, nombre, correo, rol, carrera, telefono, num, activo: true }));

    // Generador determinista para que el ejemplo sea siempre igual
    let semilla = 20260925;
    const rnd = () => { semilla = (semilla * 1103515245 + 12345) % 2147483648; return semilla / 2147483648; };
    const elegir = a => a[Math.floor(rnd() * a.length)];
    const titulos = [
        ["Proyector sin imagen en Aula 12", 4, "Edificio B · Aula 12"], ["Falla de red en Laboratorio 2", 6, "Laboratorio de cómputo 2"],
        ["Silla dañada en Biblioteca", 3, "Biblioteca"], ["No hay internet en sala de maestros", 6, "Sala de maestros"],
        ["Fuga de agua en baños del Edificio A", 3, "Edificio A · Planta baja"], ["Software de simulación sin licencia", 5, "Laboratorio de cómputo 1"],
        ["Teclado sin respuesta en PC 14", 4, "Laboratorio de cómputo 1"], ["Error al consultar calificaciones", 7, "Control Escolar"],
        ["Falta material para práctica de química", 1, "Laboratorio de Química"], ["Constancia de estudios con datos incorrectos", 2, "Servicios Escolares"],
        ["Pizarrón dañado en Aula 7", 3, "Edificio C · Aula 7"], ["Impresora atascada en coordinación", 4, "Coordinación de Ciencias Básicas"],
        ["Aire acondicionado sin funcionar", 3, "Auditorio"], ["Contraseña de plataforma bloqueada", 5, "En línea"],
        ["Cambio de horario de asesorías", 1, "Ciencias Básicas"], ["Lámparas fundidas en pasillo", 3, "Edificio B · Planta alta"],
    ];
    const incidencias = [];
    const fechaHace = (dias, horas) => new Date(HOY.getTime() - dias * 864e5 - horas * 36e5);
    for (let i = 0; i < 46; i++) {
        const [titulo, cat, ubic] = i < titulos.length ? titulos[i] : elegir(titulos);
        const dias = i < 4 ? [1, 2, 3, 5][i] : Math.floor(rnd() * 250) + 1;
        const fecha = fechaHace(dias, Math.floor(rnd() * 8));
        const reporta = i === 0 ? 3 : i === 1 ? 6 : i === 3 ? 3 : elegir([3, 3, 5, 6, 8, 7, 4]);
        const estado = i === 0 ? "En proceso" : i === 1 ? "Asignada" : i === 2 ? "Pendiente" : i === 3 ? "Resuelta"
            : elegir(["Pendiente", "En revisión", "Asignada", "En proceso", "Resuelta", "Cerrada", "Cerrada", "Cerrada", "Cancelada"]);
        const resp = ["Pendiente", "En revisión", "Cancelada"].includes(estado) ? null : (i < 2 ? 4 : elegir([4, 4, 7, 2, 5]));
        const u = usuarios.find(x => x.id === reporta);
        const inc = {
            id: i + 1, folio: "INC-" + fmtFolio(fecha), titulo, descripcion: "Se reporta: " + titulo.toLowerCase() + ". Ubicación: " + ubic + ".",

        };
        if (i === 0) inc.descripcion = "El proyector enciende pero no muestra imagen al conectar la laptop por HDMI. Se probó con dos equipos distintos.";
        const h = (tipo, texto, usuario, horas, comentario) => inc.historial.push({ tipo, texto, usuario, fecha: new Date(fecha.getTime() + horas * 36e5).toISOString(), comentario });
        h("registro", "Registró la incidencia", reporta, 0);
        if (resp) h("asignacion", "Asignó a " + usuarios.find(x => x.id === resp).nombre, 2, 1 + Math.floor(rnd() * 20));
        if (["En proceso", "Resuelta", "Cerrada"].includes(estado)) h("estado", "Asignada → En proceso", resp, 26);
        if (["Resuelta", "Cerrada"].includes(estado)) { inc.solucion = "Se atendió y se verificó con el usuario."; h("estado", "En proceso → Resuelta", resp, 30 + Math.floor(rnd() * 60), inc.solucion); }
        if (estado === "Cerrada") h("estado", "Resuelta → Cerrada", 2, 100);
        if (estado === "Cancelada") h("estado", "Pendiente → Cancelada", reporta, 5);
        if (["Resuelta", "Cerrada", "Cancelada"].includes(estado)) inc.cierre = inc.historial[inc.historial.length - 1].fecha;
        if (i === 0) {
            inc.evidencias = [{ nombre: "foto_proyector.jpg", tipo: "img", tam: "1.2 MB", usuario: 3 }, { nombre: "reporte_falla.pdf", tipo: "pdf", tam: "340 KB", usuario: 3 }];
            h("comentario", "Comentó", 4, 27, "Revisé el cable HDMI, está dañado. Mañana instalo uno nuevo.");
        }
        incidencias.push(inc);
    }
    incidencias.sort((a, b) => b.fecha.localeCompare(a.fecha));
    const notificaciones = [
        { id: 1, para: 3, inc: incidencias.find(x => x.id === 1).id, texto: "Roberto Sánchez cambió el estado a En proceso.", fecha: fechaHace(0, 3).toISOString(), leida: false },
        { id: 2, para: 3, inc: 1, texto: "Roberto Sánchez comentó: «Revisé el cable HDMI, está dañado…»", fecha: fechaHace(0, 2).toISOString(), leida: false },
        { id: 3, para: 3, inc: 4, texto: "Tu incidencia fue marcada como Resuelta.", fecha: fechaHace(1, 0).toISOString(), leida: false },
        { id: 4, para: 4, inc: 2, texto: "Se te asignó la incidencia.", fecha: fechaHace(2, 0).toISOString(), leida: false },
        { id: 5, para: 2, inc: 3, texto: "Nueva incidencia registrada.", fecha: fechaHace(3, 0).toISOString(), leida: false },
        { id: 6, para: 1, inc: 3, texto: "Nueva incidencia registrada.", fecha: fechaHace(3, 0).toISOString(), leida: false },
    ];
    return { categorias, prioridades, usuarios, incidencias, notificaciones, sesion: null, sigNoti: 7 };
}

function sumarDiasHabiles(iso, dias) { const d = new Date(iso); let n = 0; while (n < dias) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) n++; } return d; }
function puedeVer(inc) { return esGestor() || inc.usuario === S.sesion || inc.responsable === S.sesion; }
function ir(nombre, params = {}) { vista = { nombre, params }; render(); window.scrollTo(0, 0); }
function avisar(tipo, mensaje) { flash = { tipo, mensaje }; }
function notificar(destinatarios, inc, texto) {
    const unicos = [...new Set(destinatarios)].filter(id => id && id !== S.sesion);
    for (const para of unicos) S.notificaciones.push({ id: S.sigNoti++, para, inc, texto, fecha: new Date().toISOString(), leida: false });
}
const gestores = () => S.usuarios.filter(u => u.activo && ["Administrador", "Coordinador"].includes(u.rol)).map(u => u.id);
const sinLeer = () => S.notificaciones.filter(n => n.para === S.sesion && !n.leida).length;

/* ======================= Paginación ======================= */
function paginar(clave, filas) {
    const p = pag[clave] || (pag[clave] = { pagina: 1, por: 10 });
    const total = filas.length, paginas = Math.max(1, Math.ceil(total / p.por));
    if (p.pagina > paginas) p.pagina = paginas;
    const ini = (p.pagina - 1) * p.por;
    const html = () => {
        const botones = [];
        const b = (txt, n, dis, act) => `<button type="button" data-pag="${clave}" data-n="${n}" ${dis ? "disabled" : ""} class="${act ? "actual" : ""}" ${act ? 'aria-current="page"' : ""}>${txt}</button>`;
        botones.push(b("«", p.pagina - 1, p.pagina === 1));
        for (let n = 1; n <= paginas; n++) {
            if (n === 1 || n === paginas || Math.abs(n - p.pagina) <= 1) botones.push(b(n, n, n === p.pagina, n === p.pagina));
            else if (Math.abs(n - p.pagina) === 2) botones.push(`<button type="button" disabled>…</button>`);
        }
        botones.push(b("»", p.pagina + 1, p.pagina === paginas));
        return `<div class="paginacion"><span class="texto-suave">${total ? `Mostrando ${ini + 1}–${Math.min(ini + p.por, total)} de ${total}` : "Sin resultados"}</span>
        <div class="paginas">${botones.join("")}</div>
        <div class="por-pagina"><label for="por-${clave}">Por página</label><select id="por-${clave}" data-por="${clave}">${[10, 20, 50, 100].map(n => `<option ${n === p.por ? "selected" : ""}>${n}</option>`).join("")}</select></div></div>`;
    };
    return { filas: filas.slice(ini, ini + p.por), html };
}

function filtrar(lista, f) {
    return lista.filter(i => (!f.q || (i.folio + " " + i.titulo).toLowerCase().includes(f.q.toLowerCase()))
        && (!f.estado || i.estado === f.estado) && (!f.categoria || i.categoria === +f.categoria)
        && (!f.prioridad || i.prioridad === +f.prioridad) && (!f.resp || (f.resp === "0" ? !i.responsable : i.responsable === +f.resp)));
}

    <div><label for="f-q-${clave}">Buscar</label><input type="search" id="f-q-${clave}" name="q" value="${e(f.q || "")}" placeholder="Folio o título"></div>
    <div><label for="f-e-${clave}">Estado</label><select id="f-e-${clave}" name="estado">${opciones(ESTADOS.map(s => [s, s]), f.estado, "Todos")}</select></div>
    ${extra.includes("categoria") ? `<div><label for="f-c-${clave}">Categoría</label><select id="f-c-${clave}" name="categoria">${opciones(S.categorias.map(c => [c.id, c.nombre]), f.categoria, "Todas")}</select></div>` : ""}
    <div><label for="f-p-${clave}">Prioridad</label><select id="f-p-${clave}" name="prioridad">${opciones(S.prioridades.map(p => [p.id, p.nombre]), f.prioridad, "Todas")}</select></div>
    ${extra.includes("resp") ? `<div><label for="f-r-${clave}">Responsable</label><select id="f-r-${clave}" name="resp">${opciones([["0", "Sin asignar"], ...S.usuarios.filter(u => u.rol !== "Estudiante").map(u => [u.id, u.nombre])], f.resp, "Todos")}</select></div>` : ""}
    <div class="acciones"><button type="submit" class="btn btn-primary">Filtrar</button><button type="button" class="btn btn-secundario" data-limpiar="${clave}">Limpiar</button></div></form></section>`;

    } else if (soyResp && ["Asignada", "En proceso"].includes(inc.estado)) {
        lateral += `<section class="tarjeta azul"><h2>Atender incidencia</h2><form class="formulario" data-form="atender" data-id="${inc.id}">
            <div><label for="a-est">Nuevo estado</label><select id="a-est" name="estado">${opciones((inc.estado === "Asignada" ? ["En proceso", "Resuelta"] : ["Resuelta"]).map(s => [s, s]))}</select></div>
            <div><label for="a-sol">Solución o avance</label><textarea id="a-sol" name="solucion" placeholder="Obligatorio al marcarla como Resuelta"></textarea></div>
            <button type="submit" class="btn btn-primary btn-bloque">Guardar avance</button></form></section>`;
    }
    if (soyAutor && inc.estado === "Pendiente") lateral += `<section class="tarjeta"><h2>Cancelar</h2><p class="texto-suave pequeno">Puedes cancelarla mientras siga Pendiente.</p><button type="button" class="btn btn-peligro btn-bloque" data-accion="cancelar" data-id="${inc.id}">Cancelar incidencia</button></section>`;
    lateral += `<section class="tarjeta azul"><h2>Ticket</h2><p class="texto-suave pequeno">Comprobante con los datos del ticket en papel del Departamento.</p><button type="button" class="btn btn-secundario btn-bloque" data-ir="ticket" data-id="${inc.id}">Ver ticket</button></section>`;
    return titulo(e(inc.folio), e(inc.titulo), `<button type="button" class="btn btn-secundario" data-ir="${esGestor() ? "todas" : "mis"}">← Regresar</button>`) + `<div class="columnas"><div>
        <section class="tarjeta"><h2>Información</h2><div class="acciones">${badge(inc.estado)}${badge(PRI(inc.prioridad).nombre)}</div>
        <dl class="detalle-grid"><div><dt>Reportó</dt><dd>${e(U(inc.usuario).nombre)} · ${e(U(inc.usuario).rol)}</dd></div><div><dt>Categoría</dt><dd>${e(CAT(inc.categoria).nombre)}</dd></div>
        <div><dt>Ubicación</dt><dd>${e(inc.ubicacion || "—")}</dd></div><div><dt>Responsable</dt><dd>${inc.responsable ? e(U(inc.responsable).nombre) : '<span class="sin-asignar">Sin asignar</span>'}</dd></div>
        <div><dt>Registrada</dt><dd>${fecha(inc.fecha)}</dd></div><div><dt>Tiempo de atención</dt><dd>${PRI(inc.prioridad).dias} día(s) hábil(es) · vence ${fechaCorta(vence.toISOString())}${abierta && vence < HOY ? ' <span class="badge b-cancelada">Fuera de tiempo</span>' : ""}</dd></div>
        <div><dt>Carrera</dt><dd>${e(inc.carrera)}</dd></div><div><dt>Teléfono</dt><dd>${e(inc.telefono)}</dd></div></dl>
        <div class="evento-texto"><strong class="pequeno texto-suave">Descripción</strong><br>${e(inc.descripcion)}</div>
        ${inc.solucion ? `<div class="alerta alerta-exito" style="margin:12px 0 0"><strong>Solución:</strong> ${e(inc.solucion)}</div>` : ""}
        <h3 style="margin:18px 0 8px">Evidencias</h3>${evid}</section>
        <section class="tarjeta"><h2>Seguimiento</h2><ul class="timeline">${tl}</ul>
        ${inc.estado === "Cerrada" ? `<p class="texto-suave">La incidencia está cerrada y ya no admite comentarios.</p>` : `<form class="formulario" data-form="comentar" data-id="${inc.id}" style="margin-top:8px"><div><label for="cm">Agregar comentario</label><textarea id="cm" name="comentario" required placeholder="Escribe un comentario"></textarea></div>
        <div class="acciones"><button type="submit" class="btn btn-primary">Comentar</button><span class="texto-suave pequeno">En el sistema también puedes adjuntar evidencias.</span></div></form>`}</section>
        </div><div>${lateral}</div></div>`;
};

/* ======================= Ticket ======================= */
V.ticket = () => {
    const inc = S.incidencias.find(i => i.id === +vista.params.id);
    if (!inc || !puedeVer(inc)) return `<div class="alerta alerta-error">La incidencia no existe o no tienes permiso para verla.</div>`;
    const u = U(inc.usuario), pr = PRI(inc.prioridad), vence = sumarDiasHabiles(inc.fecha, pr.dias);
    const campo = (k, v) => `<div class="ticket-campo"><b>${k}</b><span>${e(v)}</span></div>`;
    return titulo("Ticket " + e(inc.folio), "Vista previa del PDF que genera el sistema", `<button type="button" class="btn btn-secundario" data-ir="detalle" data-id="${inc.id}">← Regresar al detalle</button>`) +
        `<article class="ticket" aria-label="Ticket de la incidencia"><div class="ticket-cabecera"><img src="${LOGO_EDOMEX}" alt="Gobierno del Estado de México">
        <div class="centro"><strong>TECNOLÓGICO DE ESTUDIOS SUPERIORES DE CHIMALHUACÁN</strong>C. ÓPALO 18, STA. MARÍA NATIVITAS, 56335<br>CHIMALHUACÁN, MÉX.<br><b>Departamento de Ciencias Básicas</b></div>
        <img src="${LOGO_TESCHI}" alt="TESCHI"></div>
        <section class="ticket-seccion"><h3>Datos del ticket</h3>${campo("No. de ticket", inc.folio)}${campo("Fecha y hora", fecha(inc.fecha))}${campo("Estado", inc.estado)}${campo("Responsable", inc.responsable ? U(inc.responsable).nombre : "Sin asignar")}</section>
        <section class="ticket-seccion"><h3>Solicitante</h3>${campo("Nombre", u.nombre)}${campo("Carrera", inc.carrera)}${campo("No. empleado / matrícula", inc.num)}${campo("Teléfono", inc.telefono)}${campo("Correo", u.correo)}</section>
        <section class="ticket-seccion"><h3>Solicitud</h3>${campo("Solicitud", inc.titulo)}${campo("Descripción breve", inc.descripcion)}${campo("Categoría", CAT(inc.categoria).nombre)}${campo("Prioridad", pr.nombre)}${campo("Ubicación", inc.ubicacion || "—")}${campo("Evidencias", inc.evidencias.length ? inc.evidencias.map(v => v.nombre).join(", ") : "Ninguna")}</section>
        <section class="ticket-seccion"><h3>Tiempo estimado de atención</h3>${campo("Días hábiles", pr.dias + " (prioridad " + pr.nombre + ")")}${campo("Fecha límite", fechaCorta(vence.toISOString()))}</section>
        <p class="ticket-leyenda">CONSERVE ESTE TICKET PARA GARANTÍA</p><p class="texto-suave pequeno" style="text-align:center">Cualquier aclaración o rectificación, acercarse al Departamento de Ciencias Básicas.</p>
        <div class="ticket-firmas"><div>Firma del Depto. Ciencias Básicas</div><div>Nombre y firma de la persona atendida</div><div class="sello">Sello</div></div>
        <p class="ticket-leyenda">GRACIAS POR SU VISITA</p></article>`;
};

/* ======================= Notificaciones ======================= */
V.notificaciones = () => {
    const todas = vista.params.todas;
    const mias = S.notificaciones.filter(n => n.para === S.sesion && (todas || !n.leida)).sort((a, b) => b.fecha.localeCompare(a.fecha));
    const p = paginar("noti", mias);
    return titulo("Notificaciones", "Avisos sobre tus incidencias", sinLeer() ? `<button type="button" class="btn btn-secundario" data-accion="leer-todas">Marcar todas como leídas</button>` : "") +
        `<section class="tarjeta"><div class="pestanas" role="tablist"><button type="button" role="tab" class="${todas ? "" : "activo"}" data-accion="tab-sin">Sin leer (${sinLeer()})</button><button type="button" role="tab" class="${todas ? "activo" : ""}" data-accion="tab-todas">Todas</button></div>
        <ul class="notificaciones">${p.filas.length ? p.filas.map(n => { const inc = S.incidencias.find(i => i.id === n.inc); return `<li class="notificacion ${n.leida ? "" : "no-leida"}"><div><strong style="color:var(--color-primario)">${e(inc?.folio)}</strong><br>${e(n.texto)}<br><span class="texto-suave pequeno">${fecha(n.fecha)}</span></div>
        <div class="acciones"><button type="button" class="enlace" data-ir="detalle" data-id="${n.inc}" data-leer="${n.id}">Ver incidencia</button>${n.leida ? "" : `<button type="button" class="enlace" data-accion="leer" data-id="${n.id}">Marcar leída</button>`}</div></li>`; }).join("") : `<li class="vacio">No tienes notificaciones ${todas ? "" : "sin leer"}.</li>`}</ul>${p.html()}</section>`;
};

/* ======================= Reportes ======================= */
V.reportes = () => {
    const f = filtros.reportes || {};
    let L = S.incidencias.filter(i => (!f.desde || i.fecha.slice(0, 10) >= f.desde) && (!f.hasta || i.fecha.slice(0, 10) <= f.hasta) && (!f.categoria || i.categoria === +f.categoria) && (!f.prioridad || i.prioridad === +f.prioridad));
    const abiertas = L.filter(i => !["Resuelta", "Cerrada", "Cancelada"].includes(i.estado));
    const atendidas = L.filter(i => ["Resuelta", "Cerrada"].includes(i.estado));
    const horasProm = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
    const tAsig = horasProm(L.filter(i => i.historial.some(h => h.tipo === "asignacion")).map(i => (new Date(i.historial.find(h => h.tipo === "asignacion").fecha) - new Date(i.fecha)) / 36e5));
    const tRes = horasProm(atendidas.filter(i => i.cierre).map(i => (new Date(i.cierre) - new Date(i.fecha)) / 36e5));
    const dur = h => h >= 24 ? Math.floor(h / 24) + " d " + Math.round(h % 24) + " h" : h.toFixed(1) + " h";
    const barras = (tit, pares, conBadge) => { const max = Math.max(1, ...pares.map(p => p[1])); return `<section class="tarjeta"><h2>${tit}</h2><div class="barras">${pares.map(([k, v]) => `<div class="barra-fila"><span class="barra-etiqueta" title="${e(k)}">${conBadge ? badge(k) : e(k)}</span><div class="barra-pista"><div class="barra-relleno" style="width:${(v / max * 100).toFixed(1)}%"></div></div><span class="barra-valor">${v}</span></div>`).join("")}</div></section>`; };
    const meses = []; for (let m = 8; m >= 0; m--) { const d = new Date(2026, 8 - m, 1); meses.push([d.toLocaleDateString("es-MX", { month: "short" }), d.getMonth()]); }
    const porMes = meses.map(([n, m]) => [n, L.filter(i => new Date(i.fecha).getMonth() === m && new Date(i.fecha).getFullYear() === 2026).length, L.filter(i => i.cierre && ["Resuelta", "Cerrada"].includes(i.estado) && new Date(i.cierre).getMonth() === m).length]);
    const maxMes = Math.max(1, ...porMes.flatMap(x => [x[1], x[2]]));
    const resp = S.usuarios.filter(u => L.some(i => i.responsable === u.id)).map(u => { const a = L.filter(i => i.responsable === u.id); const at = a.filter(i => ["Resuelta", "Cerrada"].includes(i.estado)); return [u, a.length, at.length, horasProm(at.filter(i => i.cierre).map(i => (new Date(i.cierre) - new Date(i.fecha)) / 36e5))]; }).sort((a, b) => b[1] - a[1]);
    return titulo("Reporte de incidencias", f.desde || f.hasta ? `Del ${f.desde || "inicio"} al ${f.hasta || "hoy"}` : "Todo el historial", `<button type="button" class="btn btn-secundario" data-accion="csv">Exportar a Excel (CSV)</button>`) +
        `<section class="tarjeta"><form class="filtros" data-form="filtros" data-clave="reportes">
        <div><label for="rp-d">Desde</label><input type="date" id="rp-d" name="desde" value="${e(f.desde || "")}"></div><div><label for="rp-h">Hasta</label><input type="date" id="rp-h" name="hasta" value="${e(f.hasta || "")}"></div>
        <div><label for="rp-c">Categoría</label><select id="rp-c" name="categoria">${opciones(S.categorias.map(c => [c.id, c.nombre]), f.categoria, "Todas")}</select></div>
        <div><label for="rp-p">Prioridad</label><select id="rp-p" name="prioridad">${opciones(S.prioridades.map(p => [p.id, p.nombre]), f.prioridad, "Todas")}</select></div>
        <div class="acciones"><button type="submit" class="btn btn-primary">Generar</button><button type="button" class="btn btn-secundario" data-limpiar="reportes">Todo</button></div></form>
        <div class="acciones" style="margin-top:12px"><span class="texto-suave">Periodo rápido:</span>${[["mes", "Este mes"], ["3m", "Últimos 3 meses"], ["anio", "Este año"]].map(([k, t]) => `<button type="button" class="btn btn-secundario btn-sm" data-periodo="${k}">${t}</button>`).join("")}</div></section>
        <div class="grid-resumen" style="margin-bottom:20px">
        <div class="resumen-item"><span class="numero">${L.length}</span><span class="etiqueta">Registradas</span></div>
        <div class="resumen-item"><span class="numero">${abiertas.length}</span><span class="etiqueta">Abiertas</span></div>
        <div class="resumen-item"><span class="numero">${atendidas.length}</span><span class="etiqueta">Atendidas (${L.length ? Math.round(atendidas.length / L.length * 100) : 0}%)</span></div>
        <div class="resumen-item"><span class="numero">${L.filter(i => i.estado === "Cancelada").length}</span><span class="etiqueta">Canceladas</span></div>
        <div class="resumen-item naranja"><span class="numero">${abiertas.filter(i => !i.responsable).length}</span><span class="etiqueta">Abiertas sin responsable</span></div>
        <div class="resumen-item naranja"><span class="numero">${abiertas.filter(i => (HOY - new Date(i.fecha)) / 864e5 > 7).length}</span><span class="etiqueta">Abiertas con más de 7 días</span></div>
        <div class="resumen-item azul"><span class="numero">${dur(tAsig)}</span><span class="etiqueta">Tiempo promedio para asignar</span></div>
        <div class="resumen-item azul"><span class="numero">${dur(tRes)}</span><span class="etiqueta">Tiempo promedio de resolución</span></div></div>
        <div class="grid-reportes">${barras("Por estado", ESTADOS.map(s => [s, L.filter(i => i.estado === s).length]), true)}${barras("Por prioridad", S.prioridades.map(p => [p.nombre, L.filter(i => i.prioridad === p.id).length]), true)}
        ${barras("Por categoría", S.categorias.map(c => [c.nombre, L.filter(i => i.categoria === c.id).length]).filter(x => x[1]).sort((a, b) => b[1] - a[1]))}
        ${barras("Por carrera", CARRERAS.map(c => [c, L.filter(i => i.carrera === c).length]).filter(x => x[1]).sort((a, b) => b[1] - a[1]))}
        <section class="tarjeta"><h2>Por mes</h2><div class="leyenda"><span><span class="muestra m-reg"></span>Registradas</span><span><span class="muestra m-ate"></span>Atendidas</span></div>
        <div class="columnas-mes">${porMes.map(([n, a, b]) => `<div class="columna-mes"><div class="columna-barras"><div class="columna m-reg" style="height:${a / maxMes * 100}%"><span>${a}</span></div><div class="columna m-ate" style="height:${b / maxMes * 100}%"><span>${b}</span></div></div><div class="columna-etiqueta">${n}</div></div>`).join("")}</div></section>
        <section class="tarjeta"><h2>Desempeño por responsable</h2><div class="tabla-contenedor"><table class="tabla"><thead><tr><th>Responsable</th><th>Asignadas</th><th>Atendidas</th><th>Prom. resolución</th></tr></thead>
        <tbody>${resp.map(([u, a, at, h]) => `<tr><td>${e(u.nombre)}</td><td class="num">${a}</td><td class="num">${at}</td><td class="num">${at ? dur(h) : "—"}</td></tr>`).join("")}</tbody></table></div></section></div>`;
};

/* ======================= Usuarios ======================= */
V.usuarios = () => {
    const f = filtros.usuarios || {};
    const L = S.usuarios.filter(u => (!f.q || (u.nombre + " " + u.correo).toLowerCase().includes(f.q.toLowerCase())) && (!f.rol || u.rol === f.rol));
    const p = paginar("usuarios", L);
    return titulo("Usuarios", S.usuarios.length + " cuentas", `<button type="button" class="btn btn-primary" data-ir="usuario">+ Nuevo usuario</button>`) +
        `<section class="tarjeta"><form class="filtros" data-form="filtros" data-clave="usuarios"><div><label for="u-q">Buscar</label><input type="search" id="u-q" name="q" value="${e(f.q || "")}" placeholder="Nombre o correo"></div>
        <div><label for="u-r">Rol</label><select id="u-r" name="rol">${opciones(ROLES.map(r => [r, r]), f.rol, "Todos")}</select></div><div class="acciones"><button type="submit" class="btn btn-primary">Filtrar</button><button type="button" class="btn btn-secundario" data-limpiar="usuarios">Limpiar</button></div></form></section>
        <section class="tarjeta"><div class="tabla-contenedor"><table class="tabla"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Matrícula / No. empleado</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
        ${p.filas.map(u => `<tr><td>${e(u.nombre)}</td><td>${e(u.correo)}</td><td>${badge(u.rol)}</td><td>${e(u.num)}</td><td>${badge(u.activo ? "Activo" : "Inactivo")}</td>
        <td><div class="acciones" style="flex-wrap:nowrap"><button type="button" class="enlace" data-ir="usuario" data-id="${u.id}">Editar</button>${u.id === S.sesion ? "" : `<button type="button" class="enlace" data-accion="toggle-usuario" data-id="${u.id}">${u.activo ? "Desactivar" : "Activar"}</button>`}</div></td></tr>`).join("")}
        </tbody></table></div>${p.html()}</section>`;
};
V.usuario = () => {
    const u = vista.params.id ? U(+vista.params.id) : null;
    const enlace = vista.params.enlace;
    return titulo(u ? "Editar usuario" : "Nuevo usuario", u ? e(u.correo) : "Crea la cuenta y entrega la contraseña inicial", `<button type="button" class="btn btn-secundario" data-ir="usuarios">← Regresar</button>`) +
        `<form data-form="usuario" data-id="${u ? u.id : ""}"><section class="tarjeta"><h2>Datos de la cuenta</h2><div class="formulario-2col">
        <div><label for="us-n">Nombre completo <span class="requerido">*</span></label><input type="text" id="us-n" name="nombre" required value="${e(u?.nombre || "")}"></div>
        <div><label for="us-c">Correo <span class="requerido">*</span></label><input type="email" id="us-c" name="correo" required value="${e(u?.correo || "")}" placeholder="nombre@teschi.edu.mx"></div>
        <div><label for="us-r">Rol <span class="requerido">*</span></label><select id="us-r" name="rol">${opciones(ROLES.map(r => [r, r]), u?.rol || "Docente")}</select></div>
        <div><label for="us-m">Matrícula o No. de empleado</label><input type="text" id="us-m" name="num" value="${e(u?.num || "")}"></div>
        <div><label for="us-ca">Carrera</label><select id="us-ca" name="carrera">${opciones(CARRERAS.map(c => [c, c]), u?.carrera || "No aplica")}</select></div>
        <div><label for="us-t">Teléfono</label><input type="tel" id="us-t" name="telefono" value="${e(u?.telefono || "")}"></div>
        ${u ? "" : `<div><label for="us-p">Contraseña inicial <span class="requerido">*</span></label><input type="password" id="us-p" name="password" minlength="8" required></div>`}</div></section>
        <div class="acciones" style="margin-bottom:20px"><button type="submit" class="btn btn-primary">${u ? "Guardar cambios" : "Crear usuario"}</button></div></form>
        ${u ? `<section class="tarjeta azul"><h2>Restablecer contraseña</h2><p class="texto-suave">Genera un enlace de un solo uso (válido 24 h) y entrégaselo al usuario.</p>
        ${enlace ? `<div class="alerta alerta-aviso">Enlace generado. Cópialo y entrégalo; no se volverá a mostrar.</div><div class="acciones"><input type="text" id="enlace-rest" readonly value="${e(enlace)}" style="flex:1;min-width:0;font-family:Consolas,monospace;font-size:.85rem"><button type="button" class="btn btn-secundario" data-accion="copiar">Copiar</button></div>`
        : `<button type="button" class="btn btn-secundario" data-accion="enlace" data-id="${u.id}">Generar enlace</button>`}</section>` : ""}`;
};

/* ======================= Catálogos ======================= */
V.catalogos = () => {
    const tab = vista.params.tab || "categorias";
    const cat = tab === "categorias";
    const lista = cat ? S.categorias : S.prioridades;
    return titulo("Catálogos", "Los estados y roles no se editan porque el flujo y los permisos dependen de sus nombres.") +
        `<section class="tarjeta"><div class="pestanas" role="tablist"><button type="button" role="tab" class="${cat ? "activo" : ""}" data-ir="catalogos" data-tab="categorias">Categorías</button><button type="button" role="tab" class="${cat ? "" : "activo"}" data-ir="catalogos" data-tab="prioridades">Prioridades</button></div>
        <form class="acciones" data-form="catalogo" data-tab="${tab}" style="margin-bottom:14px"><div style="flex:1;min-width:180px"><label for="cat-n">${cat ? "Nueva categoría" : "Nueva prioridad"}</label><input type="text" id="cat-n" name="nombre" required></div>
        ${cat ? "" : `<div style="width:170px"><label for="cat-d">Días hábiles</label><input type="number" id="cat-d" name="dias" min="1" max="30" value="3" required></div>`}<button type="submit" class="btn btn-primary" style="align-self:flex-end">Agregar</button></form>
        <div class="tabla-contenedor"><table class="tabla"><thead><tr><th>Nombre</th>${cat ? "" : "<th>Tiempo de atención</th>"}<th>Incidencias</th><th>Estado</th><th>Acción</th></tr></thead><tbody>
        ${lista.map(x => `<tr><td>${cat ? e(x.nombre) : badge(x.nombre)}</td>${cat ? "" : `<td>${x.dias} día(s) hábil(es)</td>`}<td class="num">${S.incidencias.filter(i => (cat ? i.categoria : i.prioridad) === x.id).length}</td><td>${badge(x.activo ? "Activo" : "Inactivo")}</td>
        <td><button type="button" class="enlace" data-accion="toggle-cat" data-tab="${tab}" data-id="${x.id}">${x.activo ? "Desactivar" : "Activar"}</button></td></tr>`).join("")}</tbody></table></div></section>`;
};

/* ======================= Perfil ======================= */
V.perfil = () => { const u = yo(); return titulo("Mi perfil", e(u.correo) + " · " + e(u.rol)) +
    `<div class="grid-reportes"><section class="tarjeta"><h2>Datos de contacto</h2><form class="formulario" data-form="perfil">
    <div><label for="p-car">Carrera</label><select id="p-car" name="carrera">${opciones(CARRERAS.map(c => [c, c]), u.carrera)}</select></div>
    <div><label for="p-tel">Teléfono</label><input type="tel" id="p-tel" name="telefono" value="${e(u.telefono)}"></div>
    <div><label for="p-num">Matrícula o No. de empleado</label><input type="text" id="p-num" name="num" value="${e(u.num)}"></div>
    <p class="texto-suave pequeno" style="margin:0">Se proponen al registrar una incidencia.</p><button type="submit" class="btn btn-primary">Guardar datos</button></form></section>
    <section class="tarjeta azul"><h2>Cambiar contraseña</h2><form class="formulario" data-form="password">
    <div><label for="p-a">Contraseña actual</label><input type="password" id="p-a" name="actual" required></div>
    <div><label for="p-n">Nueva contraseña</label><input type="password" id="p-n" name="nueva" minlength="8" required></div>
    <div><label for="p-c">Confirmar nueva contraseña</label><input type="password" id="p-c" name="confirmar" minlength="8" required></div>
    <button type="submit" class="btn btn-primary">Cambiar contraseña</button></form></section></div>`; };

/* ======================= Render ======================= */
const SIN_SESION = ["login", "recuperar", "restablecer"];
function render() {
    const app = document.getElementById("app");
    if (!S.sesion && !SIN_SESION.includes(vista.nombre)) vista = { nombre: "login", params: {} };
    const v = V[vista.nombre] || V.dashboard;
    app.innerHTML = SIN_SESION.includes(vista.nombre) ? v() : layout(v());
    flash = null;
    const sel = document.getElementById("proto-usuario");
    sel.innerHTML = `<option value="">(sin sesión)</option>` + S.usuarios.filter(u => u.activo).map(u => `<option value="${u.id}" ${u.id === S.sesion ? "selected" : ""}>${e(u.rol)} · ${e(nombreCorto(u.id))}</option>`).join("");
    document.title = "Prototipo Incidencias TESCHI";
}
function entrar(id) { S.sesion = id; guardar(); avisar("exito", "Bienvenido, " + U(id).nombre.split(" ")[0] + "."); ir("dashboard"); }

/* ======================= Acciones ======================= */
document.addEventListener("click", ev => {
    const b = ev.target.closest("button, [data-ir]"); if (!b) return;
    const d = b.dataset;
    if (d.leer) { const n = S.notificaciones.find(x => x.id === +d.leer); if (n) n.leida = true; guardar(); }
    if (d.entrar) return entrar(+d.entrar);
    if (d.pag) { pag[d.pag].pagina = +d.n; return render(); }
    if (d.limpiar) { filtros[d.limpiar] = {}; if (pag[d.limpiar]) pag[d.limpiar].pagina = 1; return render(); }
    if (d.periodo) { const h = "2026-09-25"; filtros.reportes = { ...filtros.reportes, hasta: h, desde: { mes: "2026-09-01", "3m": "2026-06-25", anio: "2026-01-01" }[d.periodo] }; return render(); }
    if (d.ir) {
        if (d.ir === "detalle") { const inc = S.incidencias.find(i => i.id === +d.id); if (inc) { S.notificaciones.filter(n => n.para === S.sesion && n.inc === inc.id).forEach(n => n.leida = true); guardar(); } }
        return ir(d.ir, { id: d.id, tab: d.tab });
    }
    const a = d.accion; if (!a) return;
    if (a === "salir") { S.sesion = null; guardar(); avisar("exito", "Cerraste sesión."); return ir("login"); }
    if (a === "leer-todas") { S.notificaciones.filter(n => n.para === S.sesion).forEach(n => n.leida = true); guardar(); avisar("exito", "Marcaste todas como leídas."); return render(); }
    if (a === "leer") { S.notificaciones.find(n => n.id === +d.id).leida = true; guardar(); return render(); }
    if (a === "tab-sin" || a === "tab-todas") { if (pag.noti) pag.noti.pagina = 1; return ir("notificaciones", { todas: a === "tab-todas" }); }
    if (a === "cancelar") {
        const inc = S.incidencias.find(i => i.id === +d.id);
        inc.estado = "Cancelada"; inc.cierre = new Date().toISOString(); inc.historial.push({ tipo: "estado", texto: "Pendiente → Cancelada", usuario: S.sesion, fecha: inc.cierre });
        notificar(gestores(), inc.id, "La incidencia fue cancelada por quien la reportó."); guardar(); avisar("exito", "Cancelaste la incidencia."); return render();
    }
    if (a === "toggle-usuario") { const u = U(+d.id); u.activo = !u.activo; guardar(); avisar("exito", `${u.nombre} ahora está ${u.activo ? "activo" : "inactivo"}.`); return render(); }
    if (a === "toggle-cat") { const x = (d.tab === "categorias" ? S.categorias : S.prioridades).find(y => y.id === +d.id); x.activo = !x.activo; guardar(); avisar("exito", `"${x.nombre}" ahora está ${x.activo ? "activa" : "inactiva"}.`); return ir("catalogos", { tab: d.tab }); }
    if (a === "enlace") { const tok = Array.from(crypto.getRandomValues(new Uint8Array(16)), x => x.toString(16).padStart(2, "0")).join(""); return ir("usuario", { id: d.id, enlace: "http://localhost/sistema-incidencias/public/restablecer.php?token=" + tok }); }
    if (a === "copiar") { const i = document.getElementById("enlace-rest"); navigator.clipboard?.writeText(i.value).then(() => { b.textContent = "Copiado"; }, () => { i.select(); }); if (!navigator.clipboard) i.select(); return; }
    if (a === "csv") { avisar("aviso", "En el sistema real este botón descarga un archivo CSV que abre en Excel. El prototipo no descarga archivos."); return render(); }
});
document.addEventListener("change", ev => {
    const t = ev.target;
    if (t.dataset.por) { pag[t.dataset.por].por = +t.value; pag[t.dataset.por].pagina = 1; return render(); }
    if (t.id === "proto-usuario") { if (t.value) entrar(+t.value); else { S.sesion = null; guardar(); ir("login"); } }
    if (t.id === "r-arch") {
        const lista = Array.from(t.files).slice(0, 5);
        document.getElementById("lista-archivos").innerHTML = lista.map(f => `<li class="archivo"><span class="miniatura ${f.type === "application/pdf" ? "pdf" : ""}">${f.type === "application/pdf" ? "PDF" : "IMG"}</span><span>${e(f.name)}<br><span class="texto-suave">${(f.size / 1024 / 1024).toFixed(1)} MB</span></span></li>`).join("");
    }
});
document.getElementById("proto-reiniciar").addEventListener("click", () => { S = datosIniciales(); for (const k in filtros) delete filtros[k]; for (const k in pag) delete pag[k]; guardar(); avisar("exito", "Se restauraron los datos de ejemplo."); ir("login"); });

document.addEventListener("submit", ev => {
    ev.preventDefault();
    const fm = ev.target, d = Object.fromEntries(new FormData(fm)), tipo = fm.dataset.form, id = +fm.dataset.id;
    if (tipo === "login") {
        const u = S.usuarios.find(x => x.correo.toLowerCase() === String(d.correo).trim().toLowerCase() && x.activo);
        if (!u) { avisar("error", "Correo o contraseña incorrectos."); return render(); }
        return entrar(u.id);
    }
    if (tipo === "recuperar") return ir("recuperar", { enviado: true });
    if (tipo === "restablecer") { if (d.a !== d.b) { avisar("error", "Las contraseñas no coinciden."); return render(); } avisar("exito", "Tu contraseña se actualizó. Ya puedes iniciar sesión."); return ir("login"); }
    if (tipo === "filtros") { filtros[fm.dataset.clave] = d; if (pag[fm.dataset.clave]) pag[fm.dataset.clave].pagina = 1; return render(); }
    if (tipo === "registrar") {
        const ahora = new Date(); const nid = Math.max(...S.incidencias.map(i => i.id)) + 1;
        const archivos = Array.from(document.getElementById("r-arch").files).slice(0, 5).map(f => ({ nombre: f.name, tipo: f.type === "application/pdf" ? "pdf" : "img", tam: (f.size / 1024 / 1024).toFixed(1) + " MB", usuario: S.sesion }));
        const inc = { id: nid, folio: "INC-" + fmtFolio(ahora), titulo: d.titulo.trim(), descripcion: d.descripcion.trim(), ubicacion: d.ubicacion.trim(), categoria: +d.categoria, prioridad: +d.prioridad,
            estado: "Pendiente", usuario: S.sesion, responsable: null, fecha: ahora.toISOString(), cierre: null, carrera: d.carrera, telefono: d.telefono, num: d.num, evidencias: archivos, solucion: "",
            historial: [{ tipo: "registro", texto: "Registró la incidencia", usuario: S.sesion, fecha: ahora.toISOString() }] };
        S.incidencias.unshift(inc); notificar(gestores(), nid, "Nueva incidencia registrada: " + inc.titulo); guardar();
        avisar("exito", `Registraste la incidencia ${inc.folio}. Puedes descargar su ticket.`); return ir("detalle", { id: nid });
    }
    const inc = S.incidencias.find(i => i.id === id);
    const log = (tipo, texto, comentario) => inc.historial.push({ tipo, texto, usuario: S.sesion, fecha: new Date().toISOString(), comentario: comentario || undefined });
    if (tipo === "comentar") { log("comentario", "Comentó", d.comentario.trim()); const para = [inc.usuario, inc.responsable]; if (inc.usuario === S.sesion && !inc.responsable) para.push(...gestores()); notificar(para, id, nombreCorto(S.sesion) + " comentó: «" + d.comentario.trim().slice(0, 60) + "»"); guardar(); avisar("exito", "Agregaste tu comentario."); return render(); }
    if (tipo === "gestionar") {
        const cambios = []; const nuevoResp = d.responsable ? +d.responsable : null;
        const quitado = inc.responsable && inc.responsable !== nuevoResp ? inc.responsable : null;
        if (nuevoResp !== inc.responsable) { inc.responsable = nuevoResp; log("asignacion", nuevoResp ? "Asignó a " + U(nuevoResp).nombre : "Quitó al responsable"); cambios.push("responsable");
            if (nuevoResp && ["Pendiente", "En revisión"].includes(inc.estado) && d.estado === inc.estado) d.estado = "Asignada"; }
        if (d.estado !== inc.estado) { log("estado", inc.estado + " → " + d.estado, d.comentario.trim()); inc.estado = d.estado; inc.cierre = ["Resuelta", "Cerrada", "Cancelada"].includes(d.estado) ? new Date().toISOString() : null; cambios.push("estado"); }
        else if (d.comentario.trim()) log("comentario", "Comentó", d.comentario.trim());
        if (!cambios.length && !d.comentario.trim()) { avisar("aviso", "No hiciste cambios."); return render(); }
        notificar([inc.usuario, inc.responsable, quitado, ...(["Resuelta", "Cancelada"].includes(inc.estado) ? gestores() : [])], id, "La incidencia se actualizó: " + (cambios.join(" y ") || "comentario") + ".");
        guardar(); avisar("exito", "Guardaste los cambios de " + inc.folio + "."); return render();
    }
    if (tipo === "reclasificar") {
        const t = []; if (+d.categoria !== inc.categoria) t.push("Categoría: " + CAT(inc.categoria).nombre + " → " + CAT(+d.categoria).nombre); if (+d.prioridad !== inc.prioridad) t.push("Prioridad: " + PRI(inc.prioridad).nombre + " → " + PRI(+d.prioridad).nombre);
        if (!t.length) { avisar("aviso", "La categoría y la prioridad no cambiaron."); return render(); }
        inc.categoria = +d.categoria; inc.prioridad = +d.prioridad; log("clasificacion", t.join(" · ")); notificar([inc.usuario, inc.responsable], id, "La incidencia se reclasificó. " + t.join(" · ")); guardar(); avisar("exito", "Reclasificaste la incidencia."); return render();
    }
    if (tipo === "atender") {
        if (d.estado === "Resuelta" && !d.solucion.trim()) { avisar("error", "Describe la solución para marcarla como Resuelta."); return render(); }
        log("estado", inc.estado + " → " + d.estado, d.solucion.trim()); inc.estado = d.estado; if (d.estado === "Resuelta") { inc.solucion = d.solucion.trim(); inc.cierre = new Date().toISOString(); }
        notificar([inc.usuario, ...(d.estado === "Resuelta" ? gestores() : [])], id, nombreCorto(S.sesion) + " cambió el estado a " + d.estado + "."); guardar(); avisar("exito", "Guardaste el avance."); return render();
    }
    if (tipo === "usuario") {
        const correo = d.correo.trim().toLowerCase();
        if (S.usuarios.some(u => u.correo === correo && u.id !== id)) { avisar("error", "Ya existe una cuenta con ese correo."); return render(); }
        if (id) { Object.assign(U(id), { nombre: d.nombre.trim(), correo, rol: d.rol, num: d.num, carrera: d.carrera, telefono: d.telefono }); avisar("exito", "Guardaste los cambios del usuario."); }
        else { const nid = Math.max(...S.usuarios.map(u => u.id)) + 1; S.usuarios.push({ id: nid, nombre: d.nombre.trim(), correo, rol: d.rol, num: d.num, carrera: d.carrera, telefono: d.telefono, activo: true }); avisar("exito", "Creaste la cuenta de " + d.nombre.trim() + "."); }
        guardar(); return ir("usuarios");
    }
    if (tipo === "catalogo") {
        const cat = fm.dataset.tab === "categorias"; const L = cat ? S.categorias : S.prioridades; const nombre = d.nombre.trim();
        if (L.some(x => x.nombre.toLowerCase() === nombre.toLowerCase())) { avisar("error", `"${nombre}" ya existe.`); return render(); }
        L.push({ id: Math.max(...L.map(x => x.id)) + 1, nombre, activo: true, ...(cat ? {} : { dias: +d.dias }) }); guardar(); avisar("exito", `Agregaste "${nombre}".`); return render();
    }
    if (tipo === "perfil") { Object.assign(yo(), { carrera: d.carrera, telefono: d.telefono, num: d.num }); guardar(); avisar("exito", "Guardaste tus datos de contacto."); return render(); }
    if (tipo === "password") { if (d.nueva !== d.confirmar) { avisar("error", "La nueva contraseña y su confirmación no coinciden."); return render(); } avisar("exito", "Cambiaste tu contraseña."); return render(); }
});
render();
</script>
